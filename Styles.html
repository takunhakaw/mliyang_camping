<style>*{box-sizing:border-box}body{margin:0;background:#f3f5f2;color:#26332b;font-family:Arial,"Noto Sans TC",sans-serif;line-height:1.65}header{background:#294638;color:white;padding:30px 0}header h1{margin:0;font-size:30px}.wrap{width:min(1100px,94%);margin:auto}nav{display:flex;gap:18px;flex-wrap:wrap}nav a,footer a{color:inherit}.panel{background:white;padding:24px;margin:22px 0;border-radius:14px;box-shadow:0 3px 16px #172b1b12}h2{margin-top:0;color:#315640}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}label{display:flex;flex-direction:column;font-weight:600;gap:5px}input,select{font:inherit;padding:10px;border:1px solid #cbd4cc;border-radius:7px;width:100%}.check{display:flex;flex-direction:row;align-items:center;gap:8px;margin:14px 0}.check input{width:auto}button{border:0;border-radius:7px;padding:10px 16px;margin:10px 8px 10px 0;background:#dce8df;color:#24432f;font-weight:700;cursor:pointer}button.primary{background:#315640;color:white}.notice{background:#eef5ef;padding:14px;border-radius:8px}.success{background:#edf7ee;padding:14px;border-radius:8px}.error{color:#a12d2d}.muted{color:#68766d}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.photo{border:1px solid #e2e8e3;border-radius:9px;overflow:hidden;padding:10px}.photo img{width:100%;height:160px;object-fit:cover;border-radius:6px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid #e1e7e2;text-align:left;vertical-align:top}footer{padding:20px;text-align:center}@media(max-width:600px){.panel{padding:16px}header h1{font-size:24px}table{display:block;overflow:auto}}</style>

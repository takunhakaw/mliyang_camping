<!DOCTYPE html><html><head><base target="_top"><?!= include_('Styles'); ?></head><body><main class="wrap"><h1>露營區管理後台</h1><section class="panel" id="login"><label>管理密碼<input id="pin" type="password"></label><button class="primary" onclick="login()">登入</button></section><div id="app" style="display:none">
<section class="panel"><h2>營運控制</h2><button onclick="setOpen(true)">開啟訂位</button><button onclick="setOpen(false)">暫停訂位</button><button onclick="load()">重新整理</button></section><section class="panel"><h2>訂單管理</h2><div id="orders"></div></section>
<section class="panel"><h2>封閉日期／營位</h2><div class="grid"><label>開始日<input id="bs" type="date"></label><label>結束日（不含）<input id="be" type="date"></label><label>區域<select id="ba"><option value="">全部區域</option><option>山豬區</option><option>獼猴區</option><option>飛鼠區</option></select></label><label>營位（空白＝整區）<input id="bp"></label><label>原因<input id="br"></label></div><button onclick="block()">新增封閉</button><div id="blocks"></div></section>
<section class="panel"><h2>現場訂位補登</h2><div class="grid"><label>姓名<input id="wn"></label><label>電話<input id="wt"></label><label>入住日<input id="wi" type="date"></label><label>退營日<input id="wo" type="date"></label><label>區域<select id="wa"><option>山豬區</option><option>獼猴區</option><option>飛鼠區</option></select></label><label>營位（山豬區填山豬01等）<input id="wp"></label><label>夜衝<select id="wr"><option value="false">否</option><option value="true">是</option></select></label></div><button onclick="walkin()">補登現場訂位</button></section>
<section class="panel"><h2>月營收</h2><div class="grid"><label>年<input id="yy" type="number"></label><label>月<input id="mm" type="number"></label></div><button onclick="revenue()">查詢</button><div id="rev"></div></section>
<section class="panel"><h2>照片管理</h2><p class="muted">先將照片上傳至可公開讀取的圖片空間，再貼上網址。</p><div class="grid"><label>分類<input id="pc" value="營位"></label><label>標題<input id="pt"></label><label>說明<input id="pd"></label><label>圖片URL<input id="pu"></label></div><button onclick="addPhoto()">新增照片</button><div id="photos"></div></section></div></main>
<script>let token='';const $=id=>document.getElementById(id);function call(n,a,ok){google.script.run.withSuccessHandler(ok||(()=>{})).withFailureHandler(e=>alert(e.message))[n](...a)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function login(){call('adminLogin',[$('pin').value],r=>{token=r.token;$('login').style.display='none';$('app').style.display='block';let d=new Date();$('yy').value=d.getFullYear();$('mm').value=d.getMonth()+1;load()})}
function load(){call('adminList',[token],r=>{$('orders').innerHTML='<table><tr><th>訂單</th><th>旅客／日期</th><th>營位</th><th>金額／狀態</th><th>操作</th></tr>'+r.bookings.map(b=>'<tr><td>'+esc(b['訂單編號'])+'</td><td>'+esc(b['姓名'])+'<br>'+esc(b['入住日'])+'–'+esc(b['退營日'])+'</td><td>'+esc(b['區域'])+'<br>'+esc(b['營位'])+'</td><td>NT$'+esc(b['總金額'])+'<br>'+esc(b['狀態'])+'／'+esc(b['付款狀態'])+'</td><td><button onclick="confirmPay(\''+esc(b['訂單編號'])+'\')">核帳</button><button onclick="cancelOrder(\''+esc(b['訂單編號'])+'\')">取消／退款</button><button onclick="refundDone(\''+esc(b['訂單編號'])+'\')">退款完成</button></td></tr>').join('')+'</table>';$('blocks').innerHTML=r.blocks.map(b=>'<p>'+esc(b['封閉編號'])+' '+esc(b['開始日'])+'至'+esc(b['結束日'])+' '+esc(b['區域'])+' '+esc(b['營位'])+' '+esc(b['原因'])+' <button onclick="unblock(\''+esc(b['封閉編號'])+'\')">解除</button></p>').join('');$('photos').innerHTML=r.photos.map(p=>'<p>'+esc(p['分類'])+'／'+esc(p['標題'])+' '+esc(p['圖片URL'])+'</p>').join('')})}
function confirmPay(id){if(confirm('確認已收到全額款項？'))call('adminConfirmPayment',[token,id],load)}function cancelOrder(id){let a=prompt('核定退款金額（NT$）','0');if(a===null)return;let r=prompt('審核備註','');call('adminCancelAndRefund',[token,id,a,r],load)}function refundDone(id){if(confirm('已實際完成退款？'))call('adminMarkRefundDone',[token,id],load)}function block(){call('adminBlock',[token,{start:$('bs').value,end:$('be').value,area:$('ba').value,pitch:$('bp').value,reason:$('br').value}],load)}function unblock(id){call('adminUnblock',[token,id],load)}function setOpen(v){call('adminSetBookingOpen',[token,v],()=>alert(v?'已開放':'已暫停'))}function walkin(){call('adminAddWalkin',[token,{name:$('wn').value,phone:$('wt').value,checkin:$('wi').value,checkout:$('wo').value,area:$('wa').value,pitch:$('wp').value,nightRush:$('wr').value}],r=>{alert('已補登：'+r.id);load()})}function revenue(){call('monthlyRevenue',[token,$('yy').value,$('mm').value],r=>$('rev').innerHTML='<p>訂單數：'+r.orders+'</p><p>核帳收款：NT$'+r.paid+'</p><p>完成退款：NT$'+r.refunds+'</p><h3>淨收款：NT$'+r.net+'</h3><pre>'+esc(JSON.stringify(r.byArea,null,2))+'</pre>')}function addPhoto(){call('adminAddPhoto',[token,{category:$('pc').value,title:$('pt').value,description:$('pd').value,url:$('pu').value}],load)}</script></body></html>
